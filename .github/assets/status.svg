<svg xmlns="http://www.w3.org/2000/svg" width="1056" height="230" viewBox="0 0 1056 230">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <clipPath id="card"><rect width="1056" height="230" rx="20"/></clipPath>
    <style>
      .title{font:600 13px Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#4b4b63;letter-spacing:3.5px}
      .label{font:700 13px Inter,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1.5px}
      .pill{font:600 15px Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#d6d6e6}
      .dot{animation:pulse 2s infinite}
      @keyframes pulse{50%{opacity:.25}}
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1056" height="230" fill="#07070b"/>
    <g filter="url(#blur)">
      <ellipse cx="900" cy="240" rx="200" ry="45" fill="#5b21b6" opacity=".6"/>
      <ellipse cx="620" cy="250" rx="180" ry="40" fill="#0e7490" opacity=".45"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="1055" height="229" rx="20" fill="none" stroke="#2a2550" stroke-opacity=".7"/>

  <text x="40" y="44" class="title">SYSTEM STATUS</text>
  <circle class="dot" cx="192" cy="39" r="4" fill="#22c55e"/>
  <text x="204" y="44" style="font:600 12px Inter,'Segoe UI',Helvetica,Arial,sans-serif" fill="#22c55e">online</text>

  <text x="40" y="91" class="label" fill="#9b7cf6">OS &amp; ENV</text>
  <g transform="translate(190,70)">
    <rect width="128" height="30" rx="7" fill="#15151f" stroke="#2c2c3d"/><text x="64" y="20" text-anchor="middle" class="pill">Fedora Linux</text>
    <rect x="138" width="88" height="30" rx="7" fill="#15151f" stroke="#2c2c3d"/><text x="182" y="20" text-anchor="middle" class="pill">VS Code</text>
    <rect x="236" width="88" height="30" rx="7" fill="#15151f" stroke="#2c2c3d"/><text x="280" y="20" text-anchor="middle" class="pill">Jupyter</text>
  </g>

  <text x="40" y="139" class="label" fill="#5b9cf6">SKILLS</text>
  <g transform="translate(190,118)">
    <rect width="160" height="30" rx="7" fill="#15151f" stroke="#2c2c3d"/><text x="80" y="20" text-anchor="middle" class="pill">Machine Learning</text>
    <rect x="170" width="136" height="30" rx="7" fill="#15151f" stroke="#2c2c3d"/><text x="238" y="20" text-anchor="middle" class="pill">Deep Learning</text>
    <rect x="316" width="204" height="30" rx="7" fill="#15151f" stroke="#2c2c3d"/><text x="418" y="20" text-anchor="middle" class="pill">ETL / Data Management</text>
    <rect x="530" width="200" height="30" rx="7" fill="#15151f" stroke="#2c2c3d"/><text x="630" y="20" text-anchor="middle" class="pill">Native Android (Kotlin)</text>
  </g>

  <text x="40" y="187" class="label" fill="#f5a524">BUILDING</text>
  <g transform="translate(190,166)">
    <rect width="380" height="30" rx="7" fill="#1e1640" stroke="#3b2f7a"/><text x="190" y="20" text-anchor="middle" class="pill">Native Fitness App · FastAPI + Jetpack Compose</text>
    <rect x="390" width="320" height="30" rx="7" fill="#1e1640" stroke="#3b2f7a"/><text x="550" y="20" text-anchor="middle" class="pill">Local LLM quantization &amp; optimization</text>
  </g>
</svg>
