<svg xmlns="http://www.w3.org/2000/svg" width="1056" height="206" viewBox="0 0 1056 206">
  <defs>
    <filter id="blur" filterUnits="userSpaceOnUse" x="-400" y="-400" width="1856" height="1200"><feGaussianBlur stdDeviation="62"/></filter>
    <clipPath id="card"><rect width="1056" height="206" rx="20"/></clipPath>
    <style>
      .title{font:600 13px Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9ca3af;letter-spacing:3.5px}
      .label{font:700 13px Inter,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1.5px}
      .pill{font:600 15px Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2937}
      ellipse{transform-box:fill-box;transform-origin:center;animation:drift 8s ease-in-out infinite alternate}
      ellipse:nth-child(2){animation-duration:10s;animation-direction:alternate-reverse}
      ellipse:nth-child(3){animation-duration:6.5s}
      @keyframes drift{0%{transform:translateX(-70px) scale(1);opacity:.55}50%{transform:translateX(30px) scale(1.2);opacity:.9}100%{transform:translateX(90px) scale(.9);opacity:.6}}
      ellipse{animation-name:driftC;animation-duration:11s}ellipse:nth-child(2){animation-duration:8.5s}ellipse:nth-child(3){animation-duration:5.5s}
      @keyframes driftC{0%{transform:translateX(0) scale(.85);opacity:.6}33%{transform:translateX(-60px) scale(1.2);opacity:.9}66%{transform:translateX(50px) scale(1);opacity:.55}100%{transform:translateX(110px) scale(1.3);opacity:.8}}
      .breathe{animation:breathe 4s ease-in-out infinite}
      @keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
    </style>
  </defs>  <g clip-path="url(#card)">
    <rect width="1056" height="206" fill="#ffffff"/>
    <g filter="url(#blur)" class="breathe">
      <ellipse cx="420" cy="216" rx="220" ry="50" fill="#9b72cb" opacity=".75"/>
      <ellipse cx="620" cy="221" rx="170" ry="40" fill="#4285f4" opacity=".7"/>
      <ellipse cx="1000" cy="211" rx="120" ry="40" fill="#9b72cb" opacity=".5"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="1055" height="205" rx="20" fill="none" stroke="#e5e1f5" stroke-opacity=".7"/>
  <g transform="translate(0,-10)">

  <text x="40" y="44" class="title">TECH STACK</text>

  <text x="40" y="91" class="label" fill="#9b7cf6">MACHINE LEARNING</text>
  <g transform="translate(230,70)">
    <rect width="82" height="30" rx="7" fill="#f6f7fb" stroke="#e3e5ee"/><text x="41" y="20" text-anchor="middle" class="pill">Python</text>
    <rect x="92" width="92" height="30" rx="7" fill="#f6f7fb" stroke="#e3e5ee"/><text x="138" y="20" text-anchor="middle" class="pill">PyTorch</text>
    <rect x="194" width="112" height="30" rx="7" fill="#f6f7fb" stroke="#e3e5ee"/><text x="250" y="20" text-anchor="middle" class="pill">TensorFlow</text>
    <rect x="316" width="116" height="30" rx="7" fill="#f6f7fb" stroke="#e3e5ee"/><text x="374" y="20" text-anchor="middle" class="pill">scikit-learn</text>
    <rect x="442" width="124" height="30" rx="7" fill="#f6f7fb" stroke="#e3e5ee"/><text x="504" y="20" text-anchor="middle" class="pill">Hugging Face</text>
    <rect x="576" width="88" height="30" rx="7" fill="#f6f7fb" stroke="#e3e5ee"/><text x="620" y="20" text-anchor="middle" class="pill">Jupyter</text>
  </g>

  <text x="40" y="139" class="label" fill="#5b9cf6">LLM &amp; DATA</text>
  <g transform="translate(230,118)">
    <rect width="128" height="30" rx="7" fill="#f6f7fb" stroke="#e3e5ee"/><text x="64" y="20" text-anchor="middle" class="pill">Transformers</text>
    <rect x="138" width="102" height="30" rx="7" fill="#f6f7fb" stroke="#e3e5ee"/><text x="189" y="20" text-anchor="middle" class="pill">llama.cpp</text>
    <rect x="250" width="72" height="30" rx="7" fill="#f6f7fb" stroke="#e3e5ee"/><text x="286" y="20" text-anchor="middle" class="pill">GGUF</text>
    <rect x="332" width="86" height="30" rx="7" fill="#f6f7fb" stroke="#e3e5ee"/><text x="375" y="20" text-anchor="middle" class="pill">Pandas</text>
    <rect x="428" width="82" height="30" rx="7" fill="#f6f7fb" stroke="#e3e5ee"/><text x="469" y="20" text-anchor="middle" class="pill">NumPy</text>
    <rect x="520" width="112" height="30" rx="7" fill="#f6f7fb" stroke="#e3e5ee"/><text x="576" y="20" text-anchor="middle" class="pill">PostgreSQL</text>
  </g>

  <text x="40" y="187" class="label" fill="#2dd4bf">APPS &amp; TOOLS</text>
  <g transform="translate(230,166)">
    <rect width="86" height="30" rx="7" fill="#f6f7fb" stroke="#e3e5ee"/><text x="43" y="20" text-anchor="middle" class="pill">FastAPI</text>
    <rect x="96" width="76" height="30" rx="7" fill="#f6f7fb" stroke="#e3e5ee"/><text x="134" y="20" text-anchor="middle" class="pill">Kotlin</text>
    <rect x="182" width="152" height="30" rx="7" fill="#f6f7fb" stroke="#e3e5ee"/><text x="258" y="20" text-anchor="middle" class="pill">Jetpack Compose</text>
    <rect x="344" width="84" height="30" rx="7" fill="#f6f7fb" stroke="#e3e5ee"/><text x="386" y="20" text-anchor="middle" class="pill">Docker</text>
    <rect x="438" width="54" height="30" rx="7" fill="#f6f7fb" stroke="#e3e5ee"/><text x="465" y="20" text-anchor="middle" class="pill">Git</text>
    <rect x="502" width="72" height="30" rx="7" fill="#f6f7fb" stroke="#e3e5ee"/><text x="538" y="20" text-anchor="middle" class="pill">Linux</text>
  </g>
  </g>
</svg>
